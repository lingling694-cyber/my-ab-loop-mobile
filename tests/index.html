<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立验证说明</title><link rel="stylesheet" href="../style.css"><main><h1>独立验证</h1><p>在主页面选择本地视频，然后运行所选用例。每次用例需手动启动，保持页面在前台。没有自动绕过播放授权。</p><p>原始报告含媒体接口观测和 Runner 操作记录。Observer 不读取播放器的计数或判断。时间误差没有 PASS 容差；无法观测到的边界显示 null。</p><p>场景用例（编辑 A/B、替换、无限循环）输出待审核的证据，不自动宣称通过。桌面结果不代表 iPhone 或 PWA 验证。</p><a href="../">返回播放器</a></main></html>
